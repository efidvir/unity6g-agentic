[project]
name = "u6g-catalog"
version = "0.1.0"
description = "The type catalog service"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "rfc8785>=0.1",
    "u6g",
    "uvicorn>=0.32",
]

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_catalog"]
