[project]
name = "u6g-mediator"
version = "0.1.0"
description = "The conflict fabric: the domain and cross-domain mediator endpoints"
requires-python = ">=3.12"
dependencies = [
    "u6g",
]

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_mediator"]
