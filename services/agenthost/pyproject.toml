[project]
name = "u6g-agenthost"
version = "0.1.0"
description = "The agent host of a DMO: the operator, realization, placement, gate and enforced copy"
requires-python = ">=3.12"
dependencies = [
    "u6g",
]

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_agenthost"]
