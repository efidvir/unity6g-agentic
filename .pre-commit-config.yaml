# ruff, buf lint, end-of-file and size checks (guide Section 26.1); mypy runs in make check
# Generated code is checked by the regeneration check of make check, so the hooks leave it alone.
exclude: ^(runtime/python/u6g/generated/|runtime/python/u6g/(common|logic|fabric|impl)/v[0-9]+/|runtime/rust/u6g-types/src/(contracts\.rs|proto/))
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys, --indent=2, --no-ensure-ascii]
        files: ^(schemas|examples|proto)/.*\.json$
  - repo: local
    hooks:
      - id: buf-lint
        name: buf lint
        entry: buf lint
        language: system
        files: ^proto/.*\.proto$
        pass_filenames: false
