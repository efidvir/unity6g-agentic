kind: ActionType
id: transport/action/set-modulation-profile
version: 1.1.0
owner: transport-domain
description: Set the modulation profile of a radio link
deprecated: false
targets:
  objectClass: mw-link
  parameters:
  - transport/param/modulation-profile@1.0.0
parameters:
  type: object
  additionalProperties: false
  required:
  - profile
  properties:
    profile:
      type: string
      enum:
      - bpsk
      - qpsk
      - qam-16
      - qam-32
      - qam-64
      - qam-128
      - qam-256
      - qam-512
      - qam-1024
      - qam-2048
      - qam-4096
idempotent: true
verification:
- method: msObservation
  predicate:
    metric: transport/metric/modulation@1.0.0
    eq:
      param: profile
  typicalLatency: PT10S
- method: controllerQuery
  validWhen:
    bindingProperty: stateReflectsDevice
rollback:
  method: restore-previous-profile
controllerBindings:
- binding: transport/binding/tfs-nbi@2.0.0
  operations:
  - device.config.set
provenance:
- source: teraflowsdn
  ref: 'efidvir/teraflowsdn@ddd4aaf: src/device/service/drivers/ceragon/routing.py apply_rule (acm) and client.py
    apply_acm_config'
- source: guide
  ref: Implementation guide v1.2, Section 11.4 and Table 17-1
- source: framework
  ref: '[FW] Section 3.6, the kinds of catalog entry'
teraflowsdn:
  operation: device.config.set
  configRule: /interface[name=<if>]/acm
hardware:
  status: provisional
  verifiedOn: []
  provisionalOn:
  - EtherHaul
  - IP-20
  - IP-50
  - IP-100
