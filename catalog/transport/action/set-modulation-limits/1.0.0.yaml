kind: ActionType
id: transport/action/set-modulation-limits
version: 1.0.0
owner: transport-domain
description: Set the limits of adaptive modulation on a radio link
deprecated: false
targets:
  objectClass: mw-link
  parameters:
  - transport/param/modulation-min@1.0.0
  - transport/param/modulation-max@1.0.0
parameters:
  type: object
  additionalProperties: false
  required:
  - minProfile
  - maxProfile
  properties:
    minProfile: &id001
      type: string
      enum:
      - bpsk
      - qpsk
      - qam-16
      - qam-32
      - qam-64
      - qam-128
      - qam-256
      - qam-512
      - qam-1024
      - qam-2048
      - qam-4096
    maxProfile: *id001
idempotent: true
verification:
- method: msObservation
  predicate:
    all:
    - metric: transport/metric/modulation-min@1.0.0
      eq:
        param: minProfile
    - metric: transport/metric/modulation-max@1.0.0
      eq:
        param: maxProfile
  typicalLatency: PT10S
- method: controllerQuery
  validWhen:
    bindingProperty: stateReflectsDevice
rollback:
  method: restore-previous-limits
controllerBindings:
- binding: transport/binding/tfs-nbi@2.0.0
  operations:
  - device.config.set
provenance:
- source: teraflowsdn
  ref: 'efidvir/teraflowsdn@ddd4aaf: src/device/service/drivers/ceragon/routing.py apply_rule (acm) and client.py
    apply_acm_config'
- source: guide
  ref: Implementation guide v1.2, Section 11.4 and Table 17-1
- source: framework
  ref: '[FW] Section 3.6, the kinds of catalog entry'
teraflowsdn:
  operation: device.config.set
  configRule: /interface[name=<if>]/acm
hardware:
  status: provisional
  verifiedOn: []
  provisionalOn:
  - MultiHaul TG
  - EtherHaul
  - IP-20
  - IP-50
  - IP-100
