kind: ControlParameter
id: transport/param/modulation-min
version: 1.0.0
owner: transport-domain
description: The lowest modulation adaptive modulation may select
deprecated: false
objectClass: mw-link
value:
  type: string
  values:
  - bpsk
  - qpsk
  - qam-16
  - qam-32
  - qam-64
  - qam-128
  - qam-256
  - qam-512
  - qam-1024
  - qam-2048
  - qam-4096
setBy:
- transport/binding/tfs-nbi@2.0.0
readBack:
  method: msObservation
  metric: transport/metric/modulation-min@1.0.0
teraflowsdn:
  deviceDriver: DEVICEDRIVER_CERAGON
  resourceKey: /interface[name=<if>]/acm
  field: min_modulation
families:
- apiFlavor: ceraos
  deviceNode: ceragon-radio-link:radio-link-cfg/mrmc-min-profile
  behaviour: The driver writes the value in lower case, with mrmc-mode adaptive unless adaptive_enabled is false.
  values:
  - bpsk
  - qpsk
  - qam-8
  - qam-16
  - qam-32
  - qam-64
  - qam-128
  - qam-256
  - qam-512
  - qam-1024
  - qam-2048
  - qam-4096
- apiFlavor: siklu_eh
  deviceNode: radio-bridge-eh-radio:eh-radio/min-modulation
  behaviour: The driver writes the value in lower case, with acm-enabled from adaptive_enabled.
- apiFlavor: siklu_tg
  deviceNode: none
  behaviour: The driver leaves the minimum unset on MultiHaul TG.
hardware:
  status: provisional
  verifiedOn: []
  provisionalOn:
  - MultiHaul TG
  - EtherHaul
  - IP-20
  - IP-50
  - IP-100
provenance:
- source: teraflowsdn
  ref: 'efidvir/teraflowsdn@ddd4aaf: src/device/service/drivers/ceragon/routing.py apply_rule (acm) and client.py
    apply_acm_config'
- source: device-api
  ref: ceragon-common-types:modulation-profile, as the Ceragon driver writes or reads it (efidvir/teraflowsdn@ddd4aaf)
- source: ietf
  ref: RFC 8561, module ietf-microwave-radio-link, leaf selected-min-acm
- source: guide
  ref: Implementation guide v1.2, Section 17.1 and Table 17-1
