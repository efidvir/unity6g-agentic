      description: SLO bandwidth metric. Minimum guaranteed bandwidth between two SDPs at any time.
    - identity: shared-bandwidth
      description: The shared SLO bandwidth bound. It is the limit on the bandwidth that can be shared amongst a
        group of connectivity constructs of a Slice Service.
    - identity: one-way-delay-maximum
      description: The SLO objective of this metric is the upper bound of network delay when transmitting between
        two SDPs.
      reference: 'RFC 7679: A One-Way Delay Metric for IP Performance Metrics (IPPM)'
    - identity: one-way-delay-percentile
      description: The SLO objective of this metric is percentile objective of network delay when transmitting between
        two SDPs. The metric is defined in RFC7679.
      reference: 'RFC 7679: A One-Way Delay Metric for IP Performance Metrics (IPPM)'
    - identity: two-way-delay-maximum
      description: SLO two-way delay is the upper bound of network delay when transmitting between two SDPs
      reference: 'RFC 2681: A Round-trip Delay Metric for IPPM'
    - identity: two-way-delay-percentile
      description: The SLO objective of this metric is the percentile objective of network delay when the traffic
        transmitting between two SDPs.
      reference: 'RFC 2681: A Round-trip Delay Metric for IPPM'
    - identity: one-way-delay-variation-maximum
      description: The SLO objective of this metric is maximum bound of the difference in the one-way delay between
        sequential packets between two SDPs.
      reference: 'RFC 3393: IP Packet Delay Variation Metric for IP Performance Metrics (IPPM)'
    - identity: one-way-delay-variation-percentile
      description: The SLO objective of this metric is the percentile objective in the one-way delay between sequential
        packets between two SDPs.
      reference: 'RFC 3393: IP Packet Delay Variation Metric for IP Performance Metrics (IPPM)'
    - identity: two-way-delay-variation-maximum
      description: SLO two-way delay variation is the difference in the round-trip delay between sequential packets
        between two SDPs.
      reference: 'RFC 5481: Packet Delay Variation Applicability Statement'
    - identity: two-way-delay-variation-percentile
      description: The SLO objective of this metric is the percentile objective in the round-trip delay between
        sequential packets between two SDPs.
      reference: 'RFC 5481: Packet Delay Variation Applicability Statement'
    - identity: one-way-packet-loss
      description: This metric type refers to the ratio of packets dropped to packets transmitted between two SDPs
        in one-way.
      reference: 'RFC 7680: A One-Way Loss Metric for IP Performance Metrics (IPPM)'
    - identity: two-way-packet-loss
      description: This metric type refers to the ratio of packets dropped to packets transmitted between two SDPs
        in two-way.
      reference: 'RFC 7680: A One-Way Loss Metric for IP Performance Metrics (IPPM)'
