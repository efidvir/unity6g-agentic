  ref: 'efidvir/teraflowsdn@ddd4aaf: proto/kpi_sample_types.proto KPISAMPLETYPE_RADIO_RX_PER_PERCENT; src/device/service/drivers/ceragon/Tools.py
    radio_figure and FAMILY_RADIO_FIGURES'
- source: device-api
  ref: radio-bridge-tg-radio-common:radio-common/links/active/rx-per, as the Ceragon driver writes or reads it (efidvir/teraflowsdn@ddd4aaf)
