kind: Metric
id: transport/metric/per-rx
version: 1.0.0
owner: transport-domain
description: Packet error rate of the packets received
deprecated: false
objectClass: mw-link
definition: The share of the packets received on the active link that failed, in percent, as MultiHaul TG reports
  it (rx-per). TeraFlowSDN carries it as the KPI RADIO_RX_PER_PERCENT.
value:
  type: number
  unit: '%'
  min: 0
  max: 100
type: gauge
aggregation: mean
sources:
- transport/source/sdn-telemetry@1.0.0
teraflowsdn:
  kpiSampleType: KPISAMPLETYPE_RADIO_RX_PER_PERCENT
  scope: endpoint
  scale: 1
hardware:
  status: provisional
  verifiedOn: []
  provisionalOn:
  - MultiHaul TG
provenance:
