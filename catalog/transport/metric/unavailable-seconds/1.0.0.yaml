kind: Metric
id: transport/metric/unavailable-seconds
version: 1.0.0
owner: transport-domain
description: Unavailable seconds
deprecated: false
objectClass: mw-link
definition: The unavailable seconds of the near-end carrier in the last completed 15-minute performance monitoring
  interval, as ITU-T G.826 defines them, from the carrier's PM bins on CeraOS (get-pm-bins, unavailable-seconds).
  TeraFlowSDN carries them as the KPI RADIO_UNAVAILABLE_SECONDS, one sample per interval, stamped with the interval's
  end.
value:
  type: integer
  unit: s
  min: 0
type: gauge
aggregation: sum
sources:
- transport/source/sdn-telemetry@1.0.0
teraflowsdn:
  kpiSampleType: KPISAMPLETYPE_RADIO_UNAVAILABLE_SECONDS
  scope: endpoint
  scale: 1
standard: ITU-T G.826 unavailable seconds
hardware:
  status: provisional
  verifiedOn: []
  provisionalOn:
  - IP-20
  - IP-50
  - IP-100
provenance:
- source: teraflowsdn
  ref: 'efidvir/teraflowsdn@ddd4aaf: proto/kpi_sample_types.proto KPISAMPLETYPE_RADIO_UNAVAILABLE_SECONDS; src/device/service/drivers/ceragon/Tools.py
    radio_figure and FAMILY_RADIO_FIGURES'
- source: device-api
  ref: ceragon-pm-telemetry:get-pm-bins/bins/unavailable-seconds, as the Ceragon driver writes or reads it (efidvir/teraflowsdn@ddd4aaf)
- source: itu-t
  ref: ITU-T G.826, error performance events and parameters, and Annex A on unavailable time
