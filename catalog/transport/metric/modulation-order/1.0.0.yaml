definition: 'The number of points of the constellation the near end transmits with: 4 for QPSK, 256 for 256-QAM.
  It comes from the current modulation on CeraOS and EtherHaul, and from the active link''s transmit MCS on MultiHaul
  TG through the IEEE 802.11ad single-carrier MCS set. TeraFlowSDN carries it as the KPI RADIO_TX_MODULATION_ORDER.'
