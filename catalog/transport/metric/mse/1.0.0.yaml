kind: Metric
id: transport/metric/mse
version: 1.0.0
owner: transport-domain
description: Mean square error of the demodulator
deprecated: false
objectClass: mw-link
definition: The mean square error of the near-end carrier's demodulator, in dB, as CeraOS reports it (mse-db). TeraFlowSDN
  carries it as the KPI RADIO_MSE_DB. MultiHaul TG and EtherHaul report a signal to noise figure, transport/metric/snir.
value:
  type: number
  unit: dB
type: gauge
aggregation: mean
sources:
- transport/source/sdn-telemetry@1.0.0
teraflowsdn:
  kpiSampleType: KPISAMPLETYPE_RADIO_MSE_DB
  scope: endpoint
  scale: 1
