[project]
name = "u6g-adapters-southbound"
version = "0.1.0"
description = "Southbound adapters of the Actuator, one module per controller binding"
requires-python = ">=3.12"
dependencies = [
    "u6g",
]

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_adapters_southbound"]
