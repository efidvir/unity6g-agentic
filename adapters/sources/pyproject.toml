[project]
name = "u6g-adapters-sources"
version = "0.1.0"
description = "Source adapters of the Monitoring System, one module per source kind"
requires-python = ">=3.12"
dependencies = [
    "u6g",
]

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_adapters_sources"]
