[project]
name = "u6g-cli"
version = "0.1.0"
description = "The u6g command line: descriptor toolchain, local runs, conformance runs"
requires-python = ">=3.12"
dependencies = [
    "u6g",
]

[project.scripts]
u6g = "u6g_cli.main:main"

[tool.uv.sources]
u6g = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u6g_cli"]
